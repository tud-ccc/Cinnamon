# The shared experiment library: the reader side of every format cinm-opt
# dumps, plus the compile/run driver the pipelines share. Packaged so that a
# pipeline living in another repository (the artifact) can depend on it by
# path rather than reaching into this tree with sys.path.
#
# A separate distribution from python/cinnamon deliberately. That one is about
# a build -- where its tools went, what it installed beside them -- and this
# one about what a campaign produced. They move for different reasons: a
# reader of last year's dumps wants this package at the version that wrote
# them and whatever compiler happens to be around.

[build-system]
# >=77 for the SPDX license expression and license-files.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cinm-experiments"
version = "0.1.0"
description = "Shared library for the Cinnamon experiment pipelines"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

# Only what this package itself imports. doit is deliberately absent: the
# modules here return plain task dictionaries and never import it, which is
# what lets a non-doit caller use them.
dependencies = [
    # Where an installed compiler is: the tools, the benchmark suites, the
    # UPMEM runtime, the reference model. Pure Python and dependency-free, so
    # this costs an analysis-only environment nothing; paths.py imports it
    # only when something actually needs a build, so reading a campaign's
    # results still works where none is installed.
    "cinnamon-mlir",
    "matplotlib",
    "numpy>=1.26",
    # <3 deliberately: the paper's numbers were assembled on pandas 2, and 3.0
    # changes defaults this code has never been run against (copy-on-write,
    # the string dtype). Lift it when the assemble/plot stages have been
    # re-run and compared, not before.
    "pandas>=2.0,<3",
    "scipy",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["src"]

# Files these packages read relative to themselves: the makefile compile_run.py
# shells out to (see paths.COMPILE_MAKEFILE_DIR), the viewer page view_pool
# serves, and the report templates plot_bo and analyze_landscape fill in.
[tool.setuptools.package-data]
cinm_experiments = ["Makefile"]
cinm_bo = ["pool_viewer.html", "README_*.md"]
