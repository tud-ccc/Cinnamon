name: Build and test cinnamon
run-name: 'Build and Test: ${{ github.event.head_commit.message }}'
on:
  workflow_dispatch:
  push:
  pull_request:
      types: [opened, reopened]
jobs:
  main:
    name: Build and test
    runs-on: ubuntu-24.04
    env:
      CC: clang
      CXX: clang++
      LDFLAGS: -fuse-ld=mold
      CMAKE_GENERATOR: Ninja

    steps:
      # The build scripts check out the submodules they need, shallowly and
      # only when they are actually going to build them.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install build dependencies
        run:
          sudo apt-get install clang ninja-build mold libvulkan-dev python3.12-dev ccache

      # Dependency builds are keyed on the revision this repo pins them to, so
      # a cache entry is reused until the submodule actually moves.
      - name: Resolve pinned dependency revisions
        id: revs
        run: |
          echo "llvm=$(git ls-tree --object-only HEAD third-party/llvm)" >> "$GITHUB_OUTPUT"
          echo "torch-mlir=$(git ls-tree --object-only HEAD third-party/torch-mlir)" >> "$GITHUB_OUTPUT"

      - name: Restore venv cache
        id: venv-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .venv
          key: cinnamon-venv-${{ runner.os }}-${{ hashFiles('experiments/requirements.txt') }}

      - name: Restore llvm cache
        id: llvm-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: third-party/llvm
          key: cinnamon-llvm-${{ runner.os }}-${{ steps.revs.outputs.llvm }}

      - name: Restore torch-mlir cache
        id: torch-mlir-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: third-party/torch-mlir
          key: cinnamon-torch-mlir-${{ runner.os }}-${{ steps.revs.outputs.torch-mlir }}

      - name: Setup venv
        run: .github/workflows/setup-venv.sh -reconfigure -verbose

      - name: Save venv cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .venv
          key: ${{ steps.venv-cache-restore.outputs.cache-primary-key }}

      - name: Build LLVM
        run: LLVM_CMAKE_OPTIONS='-DLLVM_CCACHE_BUILD=OFF' .github/workflows/build-llvm.sh -verbose

      - name: Save llvm cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: third-party/llvm
          key: ${{ steps.llvm-cache-restore.outputs.cache-primary-key }}

      - name: Build Torch-MLIR
        run: .github/workflows/build-torch.sh -verbose

      - name: Save torch-mlir cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: third-party/torch-mlir
          key: ${{ steps.torch-mlir-cache-restore.outputs.cache-primary-key }}

      # The UPMEM SDK is no longer publicly downloadable, so the UPMEM runtime
      # library is not built here.
      - name: Build Cinnamon
        run: .github/workflows/build-cinnamon.sh -reconfigure -verbose -no-upmem

      - name: Test Cinnamon
        run: ninja -Cbuild check-cinm-mlir
